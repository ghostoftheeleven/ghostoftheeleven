<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f1e"/>
      <stop offset="0.55" stop-color="#14112b"/>
      <stop offset="1" stop-color="#0a1a2a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ab4ff"/>
      <stop offset="0.5" stop-color="#b79cff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animate attributeName="x1" values="-300;700;700" keyTimes="0;0.35;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1000;1000" keyTimes="0;0.35;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- «печатающийся» текст: 3 фразы по 12 секунд -->
    <clipPath id="c1"><rect x="274" y="205" width="0" height="46">
      <animate attributeName="width" values="0;0;190;190;0;0" keyTimes="0;0.01;0.09;0.27;0.29;1" dur="15s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="274" y="205" width="0" height="46">
      <animate attributeName="width" values="0;0;360;360;0;0" keyTimes="0;0.33;0.45;0.6;0.62;1" dur="15s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="274" y="205" width="0" height="46">
      <animate attributeName="width" values="0;0;600;600;0;0" keyTimes="0;0.66;0.84;0.97;0.99;1" dur="15s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- aurora blobs -->
    <circle r="260" fill="url(#g1)">
      <animate attributeName="cx" values="200;420;200" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;220;60" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="240" fill="url(#g2)">
      <animate attributeName="cx" values="1000;800;1000" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;80;260" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle r="200" fill="url(#g3)">
      <animate attributeName="cx" values="640;900;640" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;120;300" dur="20s" repeatCount="indefinite"/>
    </circle>

    <!-- shooting stars -->
    <g>
      <rect x="0" y="0" width="120" height="2" rx="1" fill="url(#comet)" transform="rotate(28)">
        <animate attributeName="x" values="-150;1300;1300" keyTimes="0;0.25;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-60;-60;-60" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="90" height="1.6" rx="0.8" fill="url(#comet)" transform="rotate(28)">
        <animate attributeName="x" values="-150;-150;900;900" keyTimes="0;0.5;0.72;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="40;40;40;40" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- floating code glyphs -->
    <g font-family="'JetBrains Mono','Cascadia Code','SF Mono',Consolas,monospace" font-weight="700" fill="#b79cff" opacity="0.5">
      <text x="400" y="300" font-size="18" opacity="0">&lt;/&gt;
        <animate attributeName="y" values="310;40" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.2;0.8;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="640" y="300" font-size="16" fill="#5eead4" opacity="0">{ }
        <animate attributeName="y" values="320;50" dur="11s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.2;0.8;1" dur="11s" begin="2s" repeatCount="indefinite"/>
      </text>
      <text x="860" y="300" font-size="17" fill="#f472b6" opacity="0">0x1F
        <animate attributeName="y" values="310;60" dur="10s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.2;0.8;1" dur="10s" begin="4s" repeatCount="indefinite"/>
      </text>
      <text x="1130" y="300" font-size="16" opacity="0">fn()
        <animate attributeName="y" values="320;70" dur="12s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.2;0.8;1" dur="12s" begin="1s" repeatCount="indefinite"/>
      </text>
      <text x="240" y="300" font-size="15" fill="#5eead4" opacity="0">;
        <animate attributeName="y" values="320;80" dur="8s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.2;0.8;1" dur="8s" begin="3s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- twinkling stars -->
    <g fill="#fff">
      <circle cx="120" cy="70" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="250" r="1.3"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="40" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="40" r="1.5"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="905" cy="285" r="1.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="30" r="1.2"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- crosshair (CoD) -->
    <g transform="translate(1060 160)" opacity="0.8">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <circle r="62" stroke="#8ab4ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 10"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
        <circle r="44" stroke="#5eead4" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="46 24 8 24"/>
      </g>
      <path d="M-80 0H-22M22 0H80M0 -80V-22M0 22V80" stroke="url(#title)" stroke-width="2.5" stroke-linecap="round"/>
      <circle r="3" fill="#f472b6">
        <animate attributeName="r" values="2.5;5;2.5" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="12" stroke="#f472b6" stroke-width="1.5">
        <animate attributeName="r" values="8;56;56" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <!-- hit marker -->
      <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0">
        <path d="M-14 -14L-6 -6M14 -14L6 -6M-14 14L-6 6M14 14L6 6"/>
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.5;0.53;0.62;1" dur="3.2s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- ghost -->
    <g transform="translate(150 160)">
      <ellipse cx="0" cy="92" rx="38" ry="6" fill="#000" opacity="0.35">
        <animate attributeName="rx" values="42;28;42" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.2;0.4" dur="4.5s" repeatCount="indefinite"/>
      </ellipse>
      <circle r="92" fill="url(#g1)" opacity="0.7">
        <animate attributeName="r" values="82;100;82" dur="4.5s" repeatCount="indefinite"/>
      </circle>

      <!-- orbiting orbs -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
        <circle cx="86" cy="0" r="4" fill="#5eead4" filter="url(#glow)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="11s" repeatCount="indefinite"/>
        <circle cx="0" cy="-92" r="3" fill="#f472b6" filter="url(#glow)"/>
      </g>

      <g filter="url(#glow)">
        <animateTransform attributeName="transform" type="translate" values="0 -8;0 8;0 -8" dur="4.5s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-3 0 50;3 0 50;-3 0 50" dur="4.5s" repeatCount="indefinite"/>
          <path d="M-52 52V-6C-52 -42 -30 -62 0 -62C30 -62 52 -42 52 -6V52L35 38L17.5 52L0 38L-17.5 52L-35 38Z"
                fill="#ffffff" fill-opacity="0.07" stroke="url(#title)" stroke-width="3" stroke-linejoin="round">
            <animate attributeName="fill-opacity" values="0.06;0.14;0.06" dur="3s" repeatCount="indefinite"/>
          </path>
          <!-- eyes with blink -->
          <ellipse cx="-17" cy="-10" rx="7" ry="10" fill="#ffffff">
            <animate attributeName="ry" values="10;10;1;10;10" keyTimes="0;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="17" cy="-10" rx="7" ry="10" fill="#ffffff">
            <animate attributeName="ry" values="10;10;1;10;10" keyTimes="0;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="-15" cy="-8" rx="3" ry="4.5" fill="#0b0f1e">
            <animate attributeName="cx" values="-15;-19;-15;-12;-15" dur="6s" repeatCount="indefinite"/>
            <animate attributeName="ry" values="4.5;4.5;0.4;4.5;4.5" keyTimes="0;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="19" cy="-8" rx="3" ry="4.5" fill="#0b0f1e">
            <animate attributeName="cx" values="19;15;19;22;19" dur="6s" repeatCount="indefinite"/>
            <animate attributeName="ry" values="4.5;4.5;0.4;4.5;4.5" keyTimes="0;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/>
          </ellipse>
          <!-- blush -->
          <ellipse cx="-30" cy="10" rx="6" ry="3.5" fill="#f472b6" opacity="0.35"/>
          <ellipse cx="30" cy="10" rx="6" ry="3.5" fill="#f472b6" opacity="0.35"/>
        </g>
      </g>
    </g>

    <!-- text -->
    <text x="270" y="140" font-family="'Segoe UI','SF Pro Display',Inter,system-ui,-apple-system,Arial,sans-serif"
          font-size="78" font-weight="800" letter-spacing="-2" fill="url(#title)">Speedy</text>
    <text x="270" y="140" font-family="'Segoe UI','SF Pro Display',Inter,system-ui,-apple-system,Arial,sans-serif"
          font-size="78" font-weight="800" letter-spacing="-2" fill="url(#shine)">Speedy</text>
    <text x="274" y="182" font-family="'JetBrains Mono','Cascadia Code','SF Mono',Consolas,monospace"
          font-size="22" fill="#9aa4c7" letter-spacing="1">@ghostoftheeleven</text>

    <!-- typed tagline -->
    <g font-family="'Segoe UI','SF Pro Display',Inter,system-ui,-apple-system,Arial,sans-serif" font-size="26" font-weight="500" fill="#e6e9f5">
      <text x="274" y="238" clip-path="url(#c1)">CoD lover 🎮</text>
      <text x="274" y="238" clip-path="url(#c2)">Member of Team Ph4r0s 🛡</text>
      <text x="274" y="238" clip-path="url(#c3)">Constant interlocutor of neural networks 🧠</text>
    </g>
    <!-- blinking cursor -->
    <rect y="214" width="3" height="30" rx="1.5" fill="#5eead4">
      <animate attributeName="x" values="274;274;464;464;274;274;274;634;634;274;274;274;874;874;274"
               keyTimes="0;0.01;0.09;0.27;0.29;0.33;0.33;0.45;0.6;0.62;0.66;0.66;0.84;0.97;1" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="274" y="262" width="120" height="3" rx="1.5" fill="url(#title)">
      <animate attributeName="width" values="40;180;40" dur="6s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="23.25" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  </g>
</svg>
